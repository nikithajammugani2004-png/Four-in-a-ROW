<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243485" />
      <stop offset="100%" stop-color="#141a45" />
    </linearGradient>
    <radialGradient id="p1Grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
    <radialGradient id="p2Grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
  </defs>
  <!-- Board body -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#boardGrad)" stroke="#4338ca" stroke-width="2"/>
  <!-- Slots with tokens -->
  <circle cx="22" cy="22" r="11" fill="url(#p1Grad)"/>
  <circle cx="42" cy="22" r="11" fill="url(#p2Grad)"/>
  <circle cx="22" cy="42" r="11" fill="url(#p2Grad)"/>
  <circle cx="42" cy="42" r="11" fill="url(#p1Grad)"/>
  <!-- Inner symbol accents -->
  <circle cx="22" cy="22" r="4" fill="#ffffff" opacity="0.85"/>
  <circle cx="42" cy="22" r="5" fill="none" stroke="#111827" stroke-width="2"/>
</svg>
